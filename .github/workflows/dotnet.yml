name: .NET Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SalesApi.sln -p:NuGetAudit=true

      - name: Build
        run: dotnet build SalesApi.sln --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore tests/SalesApi.Tests/SalesApi.Tests.csproj -p:NuGetAudit=true

      - name: Run tests
        run: dotnet test tests/SalesApi.Tests/SalesApi.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Audit dependencies
        run: dotnet list SalesApi.csproj package --vulnerable --include-transitive --format json > nuget-audit.json && python3 -c 'import json,sys; data=json.load(open("nuget-audit.json")); found=[p for project in data.get("projects",[]) for framework in project.get("frameworks",[]) for p in framework.get("topLevelPackages",[])+framework.get("transitivePackages",[]) if p.get("vulnerabilities")]; print("Vulnerable packages:", len(found)); sys.exit(1 if found else 0)'
